# ---------------------------------------------------------------------------
# Loop source registry — broad, multi-category coverage.
#
# Each source declares a feed URL plus metadata used later in ranking:
#   category         topical bucket (documentation / future topic tagging)
#   country          ISO country code
#   lang             ISO language code
#   authority_weight hand-assigned 0..1 score (see README > The insight / Rank)
#
# Authority weight is deliberately manual, not inferred. New / unknown domains
# should start near zero. When adding a source in a PR, justify the weight.
# ---------------------------------------------------------------------------

sources:
